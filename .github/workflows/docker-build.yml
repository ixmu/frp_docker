name: Build and Push FRP Multi-Arch Images

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 0 */7 * *' # 每 7 天自动触发一次 (定时覆盖更新基础镜像)

env:
  # 请在仓库 Settings -> Secrets and variables -> Actions 中设置这两个 Secret
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME_FRPS: ${{ secrets.DOCKERHUB_USERNAME }}/frps
  IMAGE_NAME_FRPC: ${{ secrets.DOCKERHUB_USERNAME }}/frpc

jobs:
  get-version:
    name: Fetch Latest FRP Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.fetch.outputs.TAG }}
      version: ${{ steps.fetch.outputs.VERSION }}
    steps:
      - name: Get latest release tag from fatedier/frp
        id: fetch
        run: |
          TAG=$(curl -s https://api.github.com/repos/fatedier/frp/releases/latest | jq -r .tag_name)
          # fatedier 的 tag 带 'v'，而压缩包文件名不带 'v'，需要截取处理
          VERSION=${TAG#v} 
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest FRP version: $TAG"

  build-arch:
    name: Build and Push Arch-specific Images
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            frp_arch: amd64
          - runner: ubuntu-24.04-arm # GitHub 原生 ARM64 环境
            arch: arm64
            frp_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download FRP binary
        run: |
          TAG=${{ needs.get-version.outputs.tag }}
          VERSION=${{ needs.get-version.outputs.version }}
          URL="https://github.com/fatedier/frp/releases/download/${TAG}/frp_${VERSION}_linux_${{ matrix.frp_arch }}.tar.gz"
          echo "Downloading $URL"
          wget -qO frp.tar.gz "$URL"
          tar -xzf frp.tar.gz
          mv frp_${VERSION}_linux_${{ matrix.frp_arch }} frp_src

      - name: Generate Dockerfiles
        run: |
          # 创建 frps 的 Dockerfile
          cat <<EOF > Dockerfile.frps
          FROM alpine:latest
          RUN apk add --no-cache tzdata
          WORKDIR /app
          COPY frp_src/frps /app/frps
          COPY frp_src/frps.toml /etc/frp/frps.toml
          ENTRYPOINT ["/app/frps", "-c", "/etc/frp/frps.toml"]
          EOF

          # 创建 frpc 的 Dockerfile
          cat <<EOF > Dockerfile.frpc
          FROM alpine:latest
          RUN apk add --no-cache tzdata
          WORKDIR /app
          COPY frp_src/frpc /app/frpc
          COPY frp_src/frpc.toml /etc/frp/frpc.toml
          ENTRYPOINT ["/app/frpc", "-c", "/etc/frp/frpc.toml"]
          EOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frps (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frps
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME_FRPS }}:${{ needs.get-version.outputs.tag }}-${{ matrix.arch }}

      - name: Build and push frpc (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frpc
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME_FRPC }}:${{ needs.get-version.outputs.tag }}-${{ matrix.arch }}

  create-manifest:
    name: Merge into Multi-Arch Manifest
    needs: [get-version, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Multi-Arch Manifests
        env:
          TAG: ${{ needs.get-version.outputs.tag }}
        run: |
          # 组装 frps 的 Multi-Arch 镜像
          docker buildx imagetools create -t ${{ env.IMAGE_NAME_FRPS }}:$TAG \
            ${{ env.IMAGE_NAME_FRPS }}:$TAG-amd64 \
            ${{ env.IMAGE_NAME_FRPS }}:$TAG-arm64

          docker buildx imagetools create -t ${{ env.IMAGE_NAME_FRPS }}:latest \
            ${{ env.IMAGE_NAME_FRPS }}:$TAG-amd64 \
            ${{ env.IMAGE_NAME_FRPS }}:$TAG-arm64

          # 组装 frpc 的 Multi-Arch 镜像
          docker buildx imagetools create -t ${{ env.IMAGE_NAME_FRPC }}:$TAG \
            ${{ env.IMAGE_NAME_FRPC }}:$TAG-amd64 \
            ${{ env.IMAGE_NAME_FRPC }}:$TAG-arm64

          docker buildx imagetools create -t ${{ env.IMAGE_NAME_FRPC }}:latest \
            ${{ env.IMAGE_NAME_FRPC }}:$TAG-amd64 \
            ${{ env.IMAGE_NAME_FRPC }}:$TAG-arm64